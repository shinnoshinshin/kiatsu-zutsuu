<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="気圧頭痛">
<meta name="theme-color" content="#fbf8f3">
<title>気圧頭痛チェック</title>
<style>
  :root {
    --bg:#fbf8f3; --card:#ffffff; --ink:#2b2a33; --sub:#8a8794; --line:#ece7df;
    --pri:#5b5bd6; --pri-soft:#ecebfb;
    --calm:#6fae8a; --calm-soft:#e6f3eb;
    --mild:#d9b53f; --mild-soft:#faf3dc;
    --warn:#ee9a3a; --warn-soft:#fdecd8;
    --alert:#e2574f; --alert-soft:#fbe1df;
    --line-p:#5b5bd6;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font:inherit; cursor:pointer; }
  .muted { color:var(--sub); font-size:.8rem; }

  /* header */
  header { position:sticky; top:0; z-index:5; background:var(--bg);
    padding: calc(10px + env(safe-area-inset-top)) 16px 8px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:1.05rem; margin:0; flex:1; }
  header h1 small { display:block; font-weight:400; color:var(--sub); font-size:.78rem; margin-top:2px; }
  .icon-btn { border:0; background:var(--card); border-radius:999px; width:40px; height:40px;
    box-shadow:0 1px 4px rgba(60,50,30,.1); font-size:1.1rem; }

  main { max-width:720px; margin:0 auto; padding:0 12px; }
  .card { background:var(--card); border-radius:20px; padding:16px; margin-bottom:12px; box-shadow:0 2px 10px rgba(60,50,30,.06); }
  .tab { display:none; } .tab.on { display:block; }

  /* readout */
  .readout { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; }
  .readout .date { font-size:.85rem; color:var(--sub); line-height:1.3; }
  .readout .date b { display:block; font-size:1.25rem; color:var(--ink); }
  .readout .hour { font-size:2.6rem; font-weight:700; text-align:center; letter-spacing:-.02em; }
  .readout .hour span { font-size:1rem; font-weight:500; margin-left:2px; }
  .readout .vals { font-size:.85rem; text-align:right; line-height:1.6; }
  .readout .vals b { font-size:1.05rem; }
  .delta.down { color:var(--alert); } .delta.up { color:var(--pri); }

  .status { display:flex; align-items:center; gap:12px; margin-top:12px; padding:12px; border-radius:14px; }
  .status .badge { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:800; font-size:1.2rem; flex:none; }
  .status .t { font-weight:700; } .status .d { font-size:.82rem; color:var(--sub); margin-top:2px; }
  .lv-calm  { background:var(--calm-soft); }  .lv-calm .badge  { background:var(--calm); }
  .lv-mild  { background:var(--mild-soft); }  .lv-mild .badge  { background:var(--mild); }
  .lv-warn  { background:var(--warn-soft); }  .lv-warn .badge  { background:var(--warn); }
  .lv-alert { background:var(--alert-soft); } .lv-alert .badge { background:var(--alert); }

  /* chart */
  .chart-card { padding:12px 0 8px; overflow:hidden; }
  .chart-wrap { position:relative; }
  .scroller { overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .scroller::-webkit-scrollbar { display:none; }
  #chart svg { display:block; }
  #yaxis { position:absolute; left:0; top:0; bottom:0; width:46px; pointer-events:none;
    background:linear-gradient(to right, var(--card) 70%, rgba(255,255,255,0)); }
  #yaxis span { position:absolute; left:8px; font-size:10px; color:var(--pri); transform:translateY(-50%); }
  .legend { display:flex; gap:12px; flex-wrap:wrap; padding:8px 16px 0; font-size:.75rem; color:var(--sub); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }

  /* forecast */
  .hstrip { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .hstrip::-webkit-scrollbar { display:none; }
  .hcell { flex:none; width:72px; border-radius:14px; padding:10px 6px; text-align:center; font-size:.8rem; background:var(--bg); }
  .hcell .w { font-size:1.4rem; margin:4px 0; }
  .hcell .p { font-weight:700; }
  .hcell .chip { margin-top:6px; font-size:.7rem; border-radius:999px; padding:2px 0; color:#fff; }
  .days { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .day { border-radius:16px; padding:14px; }
  .day .h { font-weight:700; } .day .big { font-size:1.4rem; font-weight:800; margin:6px 0 2px; }

  /* note */
  .sev { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:10px 0; }
  .sev button { border:0; border-radius:14px; padding:12px 0 8px; background:var(--bg); color:var(--ink); }
  .sev button b { display:block; font-size:1.3rem; }
  .sev button small { font-size:.68rem; color:var(--sub); }
  .sev button.on { background:var(--pri); color:#fff; } .sev button.on small { color:#dcdcff; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text] { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--bg); flex:1; min-width:0; }
  .btn { border:0; border-radius:12px; padding:10px 16px; background:var(--pri); color:#fff; font-weight:700; }
  .btn.sub { background:var(--pri-soft); color:var(--pri); }
  .btn.wide { width:100%; padding:14px; margin-top:10px; font-size:1rem; }
  .log { list-style:none; padding:0; margin:8px 0 0; }
  .log li { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:.88rem; }
  .log .lv { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; flex:none; }
  .log .m { flex:1; min-width:0; } .log .m div:last-child { color:var(--sub); font-size:.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .log .x { border:0; background:none; color:var(--sub); font-size:1rem; }

  /* location sheet */
  .sheet { position:fixed; inset:0; background:rgba(30,25,40,.35); z-index:20; display:none; align-items:flex-end; }
  .sheet.on { display:flex; }
  .sheet .panel { background:var(--card); width:100%; max-width:720px; margin:0 auto; border-radius:22px 22px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); }
  .cands button { margin:6px 6px 0 0; }

  /* tab bar */
  nav { position:fixed; left:0; right:0; bottom:0; z-index:10; background:rgba(255,255,255,.96); backdrop-filter:blur(8px);
    border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; border:0; background:none; padding:8px 0 10px; color:var(--sub); font-size:.72rem; }
  nav button .i { display:block; font-size:1.3rem; margin-bottom:2px; filter:grayscale(1); opacity:.6; }
  nav button.on { color:var(--pri); font-weight:700; } nav button.on .i { filter:none; opacity:1; }
  .foot { text-align:center; margin:16px 0 8px; }
</style>
</head>
<body>
<header>
  <h1>気圧頭痛チェック<small id="placeName">場所を選んでください</small></h1>
  <button class="icon-btn" id="openLoc" aria-label="場所を変更">📍</button>
</header>

<main>
  <!-- グラフ -->
  <section class="tab on" id="tab-graph">
    <div class="card">
      <div class="readout">
        <div class="date" id="roDate">—<b>—</b></div>
        <div class="hour" id="roHour">--<span>時</span></div>
        <div class="vals" id="roVals">気温 —<br>気圧 —</div>
      </div>
      <div class="status lv-calm" id="status">
        <div class="badge" id="stBadge">・</div>
        <div><div class="t" id="stTitle">データ待ち</div><div class="d" id="stDetail">場所を選ぶと予報を読み込みます</div></div>
      </div>
    </div>

    <div class="card chart-card">
      <div class="chart-wrap">
        <div class="scroller" id="scroller"><div id="chart"></div></div>
        <div id="yaxis"></div>
      </div>
      <div class="legend">
        <span><i style="background:var(--mild)"></i>やや注意</span>
        <span><i style="background:var(--warn)"></i>注意</span>
        <span><i style="background:var(--alert)"></i>警戒</span>
        <span>● 痛みの記録</span>
        <span>タップでその時刻を表示</span>
      </div>
    </div>
  </section>

  <!-- 予報 -->
  <section class="tab" id="tab-fc">
    <div class="card">
      <div class="muted">3時間ごと（今後24時間）</div>
      <div class="hstrip" id="hourly" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <div class="muted">今日・明日</div>
      <div class="days" id="days" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <button class="btn sub wide" id="notifyBtn" style="margin:0">🔔 気圧低下を通知する</button>
      <div class="muted" style="margin-top:8px">このページを開いている間だけ通知します。</div>
    </div>
  </section>

  <!-- 記録 -->
  <section class="tab" id="tab-note">
    <div class="card">
      <div style="font-weight:700">いまの痛みは？</div>
      <div class="sev" id="sev">
        <button data-v="1"><b>1</b><small>ちょっと</small></button>
        <button data-v="2"><b>2</b><small>気になる</small></button>
        <button data-v="3" class="on"><b>3</b><small>つらい</small></button>
        <button data-v="4"><b>4</b><small>かなり</small></button>
        <button data-v="5"><b>5</b><small>動けない</small></button>
      </div>
      <div class="row">
        <label style="font-size:.9rem"><input type="checkbox" id="med"> 💊 薬を飲んだ</label>
        <input type="text" id="memo" placeholder="メモ（症状など）">
      </div>
      <button class="btn wide" id="logBtn">今の時刻で記録する</button>
    </div>
    <div class="card">
      <div class="muted">あなたの傾向</div>
      <div id="analysis" style="margin-top:6px">—</div>
    </div>
    <div class="card">
      <div class="muted">最近の記録</div>
      <ul class="log" id="logList"></ul>
    </div>
  </section>

  <div class="muted foot">判定: 6時間ごとに、前後12時間の海面気圧の下がり幅で評価（−3.1で注意、−4.2で警戒）<br>気象データ: Open-Meteo.com ／ 記録はこの端末のブラウザ内だけに保存されます。医療的な診断ではありません。</div>
</main>

<nav>
  <button data-tab="note"><span class="i">📝</span>記録</button>
  <button data-tab="graph" class="on"><span class="i">📈</span>グラフ</button>
  <button data-tab="fc"><span class="i">🌤️</span>予報</button>
</nav>

<div class="sheet" id="sheet">
  <div class="panel">
    <div style="font-weight:700;margin-bottom:10px">場所を選ぶ</div>
    <button class="btn wide" id="locBtn" style="margin:0 0 10px">📍 現在地を使う</button>
    <div class="row">
      <input type="text" id="cityInput" placeholder="地名（例: 横浜市西区）">
      <button class="btn sub" id="cityBtn">検索</button>
    </div>
    <div class="cands" id="cands"></div>
    <div class="muted" id="locMsg" style="margin-top:8px"></div>
    <button class="btn sub wide" id="closeLoc">閉じる</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const LOG_KEY = "zutsuu-log-v1", LOC_KEY = "zutsuu-loc-v1";
const HW = 26, PADL = 46;           // 1時間あたりの幅, 左の目盛り幅
let series = [], selIdx = null;
const WD = ["日","月","火","水","木","金","土"];
const LV = {
  calm:  { name:"安定",     mark:"✓", color:"var(--calm)" },
  mild:  { name:"やや注意", mark:"~", color:"var(--mild)" },
  warn:  { name:"注意",     mark:"!", color:"var(--warn)" },
  alert: { name:"警戒",     mark:"!!", color:"var(--alert)" },
};
// 判定ルール：6時間ごと（3/9/15/21時区切り）の区間を、区間をはさむ12時間の気圧変化で評価
const TH = { alert: -4.2, warn: -3.1, mild: -1.0 };
const LV_RANK = { calm: 0, mild: 1, warn: 2, alert: 3 };
function blockLevel(d12, d6) {
  if (d12 <= TH.alert) return "alert";
  if (d12 <= TH.warn) return "warn";
  if (d12 <= TH.mild || d6 <= TH.mild) return "mild";
  return "calm";
}
let blocks = [];
function computeBlocks() {
  const n = series.length, P = i => series[Math.min(Math.max(i, 0), n - 1)].p;
  blocks = [];
  for (let i = 0; i < n - 1; i++) {
    if (series[i].t.getHours() % 6 !== 3) continue;
    const j = Math.min(i + 6, n - 1);
    const d6 = P(j) - P(i), d12 = P(j + 3) - P(i - 3);
    blocks.push({ i, j, d6, d12, lv: blockLevel(d12, d6) });
  }
}
const blockAt = idx => blocks.find(b => b.i <= idx && idx < b.j) || null;
const hh = i => String(series[i].t.getHours()).padStart(2, "0");
const LV_HEX = { calm:"#6fae8a", mild:"#d9b53f", warn:"#ee9a3a", alert:"#e2574f" };
const SEV_HEX = ["#b9b6c2","#d9b53f","#ee9a3a","#e8754a","#e2574f","#b8403a"];

// ---- タブ ----
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "tab-" + b.dataset.tab));
  if (b.dataset.tab === "graph") scrollToIdx(selIdx ?? nowIdx(), false);
  window.scrollTo(0, 0);
});

// ---- 記録 ----
const loadLog = () => { try { return JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); } catch { return []; } };
const saveLog = l => localStorage.setItem(LOG_KEY, JSON.stringify(l));
let sev = 3;
$("sev").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  sev = +b.dataset.v; [...$("sev").children].forEach(x => x.classList.toggle("on", x === b)); };
$("logBtn").onclick = () => {
  const l = loadLog(); l.push({ t: Date.now(), s: sev, m: $("med").checked, n: $("memo").value.trim() }); saveLog(l);
  $("memo").value = ""; $("med").checked = false;
  $("logBtn").textContent = "✓ 記録しました"; setTimeout(() => $("logBtn").textContent = "今の時刻で記録する", 1500);
  renderLog(); drawChart(); analyzeLog();
};
function renderLog() {
  const log = loadLog().sort((a, b) => b.t - a.t).slice(0, 20);
  $("logList").innerHTML = log.length ? log.map(e => {
    const p = pressureAt(new Date(e.t));
    return `<li><div class="lv" style="background:${SEV_HEX[e.s]}">${e.s}</div>
      <div class="m"><div>${fmt(new Date(e.t))}${e.m ? "　💊" : ""}${p ? `　${p.toFixed(0)} hPa` : ""}</div><div>${esc(e.n || "")}</div></div>
      <button class="x" data-del="${e.t}" aria-label="削除">✕</button></li>`;
  }).join("") : '<li class="muted">まだ記録がありません</li>';
}
$("logList").onclick = ev => {
  const t = ev.target.dataset.del; if (!t) return;
  saveLog(loadLog().filter(e => String(e.t) !== t)); renderLog(); drawChart(); analyzeLog();
};

// ---- 場所 ----
const sheet = $("sheet");
$("openLoc").onclick = () => sheet.classList.add("on");
$("closeLoc").onclick = () => sheet.classList.remove("on");
sheet.onclick = e => { if (e.target === sheet) sheet.classList.remove("on"); };
function showPlace(name, cur) {
  $("placeName").textContent = cur ? `📍 ${name}（現在地）` : name;
}
function setPlace(lat, lon, name, cur = false) {
  localStorage.setItem(LOC_KEY, JSON.stringify({ lat, lon, name, cur }));
  showPlace(name, cur);
  sheet.classList.remove("on");
  fetchForecast(lat, lon);
}

// 緯度経度 → 市区町村名（国土地理院の逆ジオコーダ＋市区町村コード表）
let muniTable = null;
async function cityName(lat, lon) {
  const u = new URL("https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress");
  u.searchParams.set("lat", lat); u.searchParams.set("lon", lon);
  const j = await fetch(u).then(r => r.json());
  const code = j.results && j.results.muniCd;
  if (!code) return null;
  muniTable ??= await fetch("https://maps.gsi.go.jp/js/muni.js").then(r => r.text());
  const m = muniTable.match(new RegExp(`"0?${String(+code)}"\\]\\s*=\\s*'([^']*)'`));
  if (!m) return null;
  const parts = m[1].split(",")[3].split(/[\s　]+/).filter(Boolean);   // 例: ["横浜市","西区"] / ["愛甲郡","愛川町"]
  if (parts.length > 1 && parts[0].endsWith("郡")) parts.shift();
  return parts.join("");
}

function useCurrentLocation(silent) {
  if (!navigator.geolocation) { if (!silent) $("locMsg").textContent = "このブラウザは位置情報に対応していません"; return; }
  if (!silent) $("locMsg").textContent = "現在地を取得中…";
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    $("locMsg").textContent = "";
    let prev = null; try { prev = JSON.parse(localStorage.getItem(LOC_KEY) || "null"); } catch {}
    setPlace(lat, lon, prev && prev.cur ? prev.name : "現在地", true);
    try {
      const name = await cityName(lat, lon);
      if (name) { localStorage.setItem(LOC_KEY, JSON.stringify({ lat, lon, name, cur: true })); showPlace(name, true); }
    } catch {}
  }, err => {
    if (!silent) $("locMsg").textContent = "現在地を取得できませんでした（" + err.message + "）。地名で検索してください。";
  }, { timeout: 10000, maximumAge: 300000 });
}
$("locBtn").onclick = () => useCurrentLocation(false);
$("cityBtn").onclick = searchCity;
$("cityInput").addEventListener("keydown", e => { if (e.key === "Enter") searchCity(); });
async function searchCity() {
  const q = $("cityInput").value.trim(); if (!q) return;
  $("cands").innerHTML = '<div class="muted">検索中…</div>';
  const names = [q, ...["都", "府", "県", "市", "区", "町", "村"].map(x => q + x)];
  const rs = await Promise.all(names.map(n =>
    fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(n)}&count=5&language=ja`)
      .then(r => r.json()).then(r => r.results || []).catch(() => [])));
  const seen = new Set(); let list = [];
  for (const c of rs.flat()) if (c.country_code === "JP" && !seen.has(c.id)) { seen.add(c.id); list.push(c); }
  const places = list.filter(c => !c.feature_code || c.feature_code.startsWith("PPL") || c.feature_code.startsWith("ADM"));
  if (places.length) list = places.sort((a, b) => (b.population || 0) - (a.population || 0));
  if (!list.length) { $("cands").innerHTML = '<div class="muted">見つかりませんでした。別の書き方（例: 札幌市）でも試してください</div>'; return; }
  if (list.length === 1) { $("cands").innerHTML = ""; return pick(list[0]); }
  $("cands").innerHTML = '<div class="muted" style="margin-top:8px">候補から選んでください</div>' + list.slice(0, 8).map((c, i) =>
    `<button class="btn sub" data-i="${i}">${esc(c.name)}<span class="muted">（${esc([c.admin1, c.admin2].filter(Boolean).join(" "))}）</span></button>`).join("");
  $("cands").onclick = e => { const b = e.target.closest("button"); if (b) { $("cands").innerHTML = ""; pick(list[b.dataset.i]); } };
}
function pick(c) { setPlace(c.latitude, c.longitude, c.name); }

// ---- 気象データ ----
async function fetchForecast(lat, lon) {
  $("stTitle").textContent = "読み込み中…"; $("stDetail").textContent = "";
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
              `&hourly=pressure_msl,temperature_2m,weather_code&past_days=2&forecast_days=3&timezone=auto`;
  try {
    const d = await fetch(url).then(r => r.json());
    series = d.hourly.time.map((t, i) => ({ t: new Date(t), p: d.hourly.pressure_msl[i], temp: d.hourly.temperature_2m[i], wc: d.hourly.weather_code[i] }));
    computeBlocks();
    selIdx = nowIdx();
    analyze(); drawChart(); renderReadout(); renderLog(); renderHourly(); renderDays(); analyzeLog(); notifyIfNeeded();
    requestAnimationFrame(() => scrollToIdx(selIdx, false));
  } catch (e) {
    $("stTitle").textContent = "データ取得に失敗しました"; $("stDetail").textContent = "通信状況を確認してください";
  }
}
const nowIdx = () => { const n = Date.now(); let b = 0; series.forEach((s, i) => { if (Math.abs(s.t - n) < Math.abs(series[b].t - n)) b = i; }); return b; };
function pressureAt(date) {
  if (!series.length) return null;
  let best = series[0];
  for (const s of series) if (Math.abs(s.t - date) < Math.abs(best.t - date)) best = s;
  return Math.abs(best.t - date) < 3600e3 * 1.5 ? best.p : null;
}
const drop3 = i => i >= 3 ? series[i].p - series[i - 3].p : null;

// ---- 今後24時間の判定 ----
function analyze() {
  const now = Date.now(), ni = nowIdx();
  const ahead = blocks.filter(b => b.j > ni && series[b.i].t <= now + 24 * 3600e3);
  let top = null;
  for (const b of ahead) if (!top || LV_RANK[b.lv] > LV_RANK[top.lv] || (b.lv === top.lv && b.d12 < top.d12)) top = b;
  const lv = top ? top.lv : "calm", L = LV[lv];
  window.worstLv = LV_RANK[lv];
  $("status").className = "status lv-" + lv;
  $("stBadge").textContent = L.mark;
  $("stTitle").textContent = `今後24時間：${L.name}`;
  $("stDetail").textContent = top && lv !== "calm"
    ? `いちばん注意が必要なのは ${series[top.i].t.getMonth() + 1}/${series[top.i].t.getDate()} ${hh(top.i)}〜${hh(top.j)}時（前後12時間で ${top.d12.toFixed(1)} hPa）`
    : "大きな気圧低下は見込まれません";
}

// ---- 選択時刻の表示 ----
function renderReadout() {
  const s = series[selIdx]; if (!s) return;
  $("roDate").innerHTML = `${s.t.getFullYear()}<b>${s.t.getMonth() + 1}/${s.t.getDate()}（${WD[s.t.getDay()]}）</b>`;
  $("roHour").innerHTML = `${s.t.getHours()}<span>時</span>`;
  const b = blockAt(selIdx);
  const ds = !b ? "" : `<br><span class="muted">${hh(b.i)}〜${hh(b.j)}時</span> <b class="delta ${b.d6 < 0 ? "down" : "up"}">${b.d6 > 0 ? "+" : ""}${b.d6.toFixed(1)}</b>`;
  $("roVals").innerHTML = `気温 <b>${s.temp.toFixed(0)}</b>℃<br>気圧 <b>${s.p.toFixed(1)}</b>${ds}`;
}

// ---- 横スクロールのグラフ ----
function drawChart() {
  if (!series.length) return;
  const n = series.length, W = PADL + n * HW + 16, H = 330;
  const R = { day: 14, hour: 32, wx: 58, risk: 78, riskH: 40, plotT: 132, plotB: H - 14 };
  const ps = series.map(s => s.p);
  const lo = Math.floor(Math.min(...ps) - 1), hi = Math.ceil(Math.max(...ps) + 1);
  const x = i => PADL + i * HW + HW / 2;
  const y = p => R.plotT + (hi - p) / (hi - lo) * (R.plotB - R.plotT);
  const step = hi - lo > 16 ? 5 : hi - lo > 8 ? 2 : 1;
  const ni = nowIdx();
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

  // 過去を薄く
  s += `<rect x="0" y="0" width="${x(ni)}" height="${H}" fill="#f6f3ee"/>`;
  // 横の目盛り線
  let ticks = "";
  for (let p = Math.ceil(lo / step) * step; p <= hi; p += step) {
    s += `<line x1="0" x2="${W}" y1="${y(p)}" y2="${y(p)}" stroke="#ece7df" ${p % 5 ? "" : 'stroke-width="1.5"'}/>`;
    ticks += `<span style="top:${y(p)}px">${p}</span>`;
  }
  $("yaxis").innerHTML = ticks;

  // 6時間ごとの警戒ブロック
  for (const b of blocks) {
    const lv = b.lv, d = b.d6;
    if (lv === "calm") continue;
    const x0 = x(b.i) + 2, w = x(b.j) - x(b.i) - 4, c = LV_HEX[lv];
    s += `<rect x="${x0}" y="${R.plotT - 6}" width="${w}" height="${R.plotB - R.plotT + 6}" fill="${c}" fill-opacity=".08" rx="10"/>`;
    s += `<rect x="${x0}" y="${R.risk}" width="${w}" height="${R.riskH}" rx="12" fill="${c}" fill-opacity=".9"/>`;
    s += `<text x="${x0 + w / 2}" y="${R.risk + 17}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${LV[lv].name}</text>`;
    s += `<text x="${x0 + w / 2}" y="${R.risk + 32}" text-anchor="middle" font-size="10" fill="#fff">${d.toFixed(1)}hPa</text>`;
  }

  // 時刻・日付・天気
  for (let i = 0; i < n; i++) {
    const t = series[i].t, h = t.getHours();
    if (h === 0) {
      s += `<line x1="${x(i) - HW / 2}" x2="${x(i) - HW / 2}" y1="0" y2="${H}" stroke="#d8d1c6" stroke-dasharray="3 4"/>`;
      s += `<text x="${x(i) - HW / 2 + 6}" y="${R.day}" font-size="12" font-weight="700" fill="#2b2a33">${t.getMonth() + 1}/${t.getDate()}（${WD[t.getDay()]}）</text>`;
    }
    if (h % 3 === 0) {
      s += `<text x="${x(i)}" y="${R.hour}" text-anchor="middle" font-size="10" fill="#8a8794">${h}時</text>`;
      s += `<text x="${x(i)}" y="${R.wx}" text-anchor="middle" font-size="15">${wIcon(series[i].wc)}</text>`;
      s += `<text x="${x(i)}" y="${R.wx + 14}" text-anchor="middle" font-size="9" fill="#c0703a">${series[i].temp.toFixed(0)}°</text>`;
    }
  }

  // 気圧の線（面＋線）
  const pts = series.map((q, i) => `${x(i)},${y(q.p)}`).join(" ");
  s += `<polygon points="${x(0)},${R.plotB} ${pts} ${x(n - 1)},${R.plotB}" fill="#5b5bd6" fill-opacity=".07"/>`;
  s += `<polyline points="${series.slice(0, ni + 1).map((q, i) => `${x(i)},${y(q.p)}`).join(" ")}" fill="none" stroke="#a9a8e6" stroke-width="2.5" stroke-linejoin="round"/>`;
  s += `<polyline points="${series.slice(ni).map((q, i) => `${x(i + ni)},${y(q.p)}`).join(" ")}" fill="none" stroke="#5b5bd6" stroke-width="3" stroke-linejoin="round"/>`;

  // 現在
  s += `<line x1="${x(ni)}" x2="${x(ni)}" y1="${R.risk - 6}" y2="${R.plotB}" stroke="#2b2a33" stroke-width="1.5"/>`;
  s += `<rect x="${x(ni) - 18}" y="${R.plotB - 18}" width="36" height="16" rx="8" fill="#2b2a33"/><text x="${x(ni)}" y="${R.plotB - 6.5}" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">いま</text>`;

  // 痛みの記録
  for (const e of loadLog()) {
    const p = pressureAt(new Date(e.t)); if (p == null) continue;
    const xi = PADL + (e.t - series[0].t) / 3600e3 * HW + HW / 2;
    s += `<circle cx="${xi}" cy="${y(p)}" r="${4 + e.s}" fill="${SEV_HEX[e.s]}" fill-opacity=".85" stroke="#fff" stroke-width="2"/>`;
  }

  // 選択中の時刻
  if (selIdx != null) {
    s += `<line x1="${x(selIdx)}" x2="${x(selIdx)}" y1="${R.risk - 6}" y2="${R.plotB}" stroke="#5b5bd6" stroke-width="1" stroke-dasharray="2 3"/>`;
    s += `<circle cx="${x(selIdx)}" cy="${y(series[selIdx].p)}" r="6.5" fill="#fff" stroke="#5b5bd6" stroke-width="3"/>`;
  }
  // タップ用の透明な領域
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="hit"/>`;
  $("chart").innerHTML = s + "</svg>";
}
$("chart").addEventListener("click", ev => {
  if (!series.length) return;
  const r = $("chart").firstChild.getBoundingClientRect();
  const i = Math.round((ev.clientX - r.left - PADL - HW / 2) / HW);
  if (i < 0 || i >= series.length) return;
  selIdx = i; drawChart(); renderReadout();
});
function scrollToIdx(i, smooth) {
  const sc = $("scroller"); if (i == null) return;
  const target = PADL + i * HW - sc.clientWidth * 0.35;
  sc.scrollTo({ left: Math.max(0, target), behavior: smooth ? "smooth" : "auto" });
}

// ---- 予報タブ ----
function renderHourly() {
  const now = Date.now();
  const idx = series.map((q, i) => i).filter(i => series[i].t.getHours() % 3 === 0 && series[i].t >= now - 3600e3 && series[i].t <= now + 24 * 3600e3);
  $("hourly").innerHTML = idx.map(i => {
    const q = series[i], b = blockAt(i), lv = b ? b.lv : "calm";
    return `<div class="hcell"><div>${q.t.getDate()}日 ${q.t.getHours()}時</div><div class="w">${wIcon(q.wc)}</div>
      <div>${q.temp.toFixed(0)}℃</div><div class="p">${q.p.toFixed(0)}</div>
      <div class="chip" style="background:${LV_HEX[lv]}">${LV[lv].name}</div></div>`;
  }).join("");
}
function renderDays() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  $("days").innerHTML = [0, 1].map(k => {
    const d0 = +today + k * 86400e3, d1 = d0 + 86400e3;
    const idx = series.map((q, i) => i).filter(i => series[i].t >= d0 && series[i].t < d1);
    if (!idx.length) return "";
    const bs = blocks.filter(b => idx.includes(b.i));
    let lv = "calm", worst = 0;
    bs.forEach(b => { if (LV_RANK[b.lv] > LV_RANK[lv]) lv = b.lv; if (b.d12 < worst) worst = b.d12; });
    const temps = idx.map(i => series[i].temp), dt = new Date(d0);
    return `<div class="day lv-${lv}" style="background:var(--${lv}-soft)">
      <div class="h">${k ? "明日" : "今日"} ${dt.getMonth() + 1}/${dt.getDate()}（${WD[dt.getDay()]}）</div>
      <div class="big" style="color:${LV_HEX[lv]}">${LV[lv].name}</div>
      <div class="muted">最大の下降 ${worst.toFixed(1)} hPa / 12h</div>
      <div class="muted">${Math.min(...temps).toFixed(0)}〜${Math.max(...temps).toFixed(0)}℃</div></div>`;
  }).join("");
}

const fmt = d => `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const wIcon = c => c === 0 ? "☀️" : c <= 3 ? "⛅" : c <= 48 ? "🌫️" : c <= 67 ? "🌧️" : c <= 77 ? "❄️" : c <= 82 ? "🌦️" : c <= 86 ? "❄️" : "⛈️";

// ---- 傾向分析 ----
function analyzeLog() {
  const log = loadLog();
  if (log.length < 10) { $("analysis").textContent = `あと ${10 - log.length} 回記録すると分析できます（現在 ${log.length} 回）`; return; }
  const ds = log.map(e => { const a = pressureAt(new Date(e.t)), b = pressureAt(new Date(e.t - 3 * 3600e3)); return a != null && b != null ? a - b : null; }).filter(v => v != null);
  if (ds.length < 5) { $("analysis").textContent = "記録した日時の気圧データが足りません（直近5日ぶんまで分析できます）"; return; }
  const avg = ds.reduce((a, b) => a + b, 0) / ds.length;
  $("analysis").textContent = `頭痛の3時間前からの気圧変化は平均 ${avg.toFixed(1)} hPa（${ds.length}件）。` +
    (avg <= -1.5 ? "気圧が下がるときに出やすい傾向です。" : avg >= 1.5 ? "気圧が上がるときに出やすい傾向です。" : "気圧変化との関係ははっきりしません。");
}

// ---- 通知 ----
$("notifyBtn").onclick = async () => {
  if (!("Notification" in window)) return $("notifyBtn").textContent = "このブラウザは通知に対応していません";
  const r = await Notification.requestPermission();
  localStorage.setItem("zutsuu-notify", r === "granted" ? "1" : "");
  $("notifyBtn").textContent = r === "granted" ? "🔔 通知オン" : "通知が許可されませんでした";
  notifyIfNeeded();
};
function notifyIfNeeded() {
  if (!("Notification" in window) || localStorage.getItem("zutsuu-notify") !== "1" || Notification.permission !== "granted") return;
  const today = new Date().toDateString();
  if (window.worstLv >= 2 &&localStorage.getItem("zutsuu-notified") !== today) {
    new Notification("気圧が下がります", { body: $("stDetail").textContent });
    localStorage.setItem("zutsuu-notified", today);
  }
}

// ---- 起動 ----
renderLog(); analyzeLog();
let saved = null; try { saved = JSON.parse(localStorage.getItem(LOC_KEY) || "null"); } catch {}
if (saved) {
  setPlace(saved.lat, saved.lon, saved.name, !!saved.cur);
  if (saved.cur || saved.name === "現在地") useCurrentLocation(true);   // 開くたびに現在地を更新
} else sheet.classList.add("on");
</script>
